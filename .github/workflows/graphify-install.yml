name: install graphify

on:
  push:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Environment checks
        run: |
          echo "## runner"
          uname -a
          echo "pwd: $PWD"
          echo "python3: $(python3 --version 2>&1)"
          echo "git: $(git --version)"
          echo "node: $(node --version 2>&1 || echo absent)"
          echo "npm: $(npm --version 2>&1 || echo absent)"
          echo "VIRTUAL_ENV=${VIRTUAL_ENV:-<none>}"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.x"

      - name: Install graphify 0.9.115 into an isolated venv
        run: |
          set -euxo pipefail
          uv venv --python 3.12 .venv-graphify
          source .venv-graphify/bin/activate
          uv pip install "graphifyy==0.9.115"

          echo "## installed"
          python -c "import graphify, sys; print('import ok:', graphify.__file__); print('python:', sys.version.split()[0])"
          graphify --version
          pip freeze | grep -Ei '^graphifyy|^tree-sitter' || true

      - name: CLI surface
        run: |
          set -euxo pipefail
          source .venv-graphify/bin/activate
          which graphify
          graphify --help > /tmp/graphify-help.txt
          head -n 25 /tmp/graphify-help.txt

      - name: Smoke test with a real extraction
        run: |
          set -euo pipefail
          source .venv-graphify/bin/activate
          mkdir -p /tmp/gfixture
          printf 'def double(value):\n    return value * 2\n\n\ndef main():\n    return double(21)\n' > /tmp/gfixture/demo.py
          cd /tmp/gfixture
          GRAPHIFY_BACKEND=none graphify extract . --code-only
          echo "## outputs"
          find graphify-out -maxdepth 1 -type f | sort

      - name: Assert the graph has nodes
        run: |
          set -euo pipefail
          source .venv-graphify/bin/activate
          cd /tmp/gfixture
          python - <<'PY'
          import json, pathlib, sys

          path = pathlib.Path("graphify-out/graph.json")
          if not path.exists():
              sys.exit("FAIL: graph.json was not written")

          data = json.loads(path.read_text())
          nodes = data.get("nodes") or []
          edges = data.get("links") or data.get("edges") or []
          print(f"nodes={len(nodes)} edges={len(edges)}")
          if not nodes:
              sys.exit("FAIL: zero nodes extracted")
          print("PASS: graph built and parsed")
          PY


  head-to-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out the corpus
        uses: actions/checkout@v4
        with:
          repository: tashfeenahmed/freellmapi
          fetch-depth: 1
          sparse-checkout: |
            server/src
            shared
            cli
          path: corpus
      - name: Install graphify
        run: |
          set -euxo pipefail
          python3 -m venv .venv-graphify
          source .venv-graphify/bin/activate
          pip install --quiet "graphifyy==0.9.115"
          graphify --version
      - name: Build graphify's graph over the corpus
        run: |
          set -euo pipefail
          source .venv-graphify/bin/activate
          cd corpus
          GRAPHIFY_BACKEND=none graphify extract . --code-only
          ls -la graphify-out/graph.json
      - name: Ladder on the same corpus
        run: |
          set -euo pipefail
          source .venv-graphify/bin/activate
          python3 eval/retrieval_bench.py corpus --auto 25 --sweep 4000
      - name: graphify query, scored the same way
        run: |
          set -euo pipefail
          source .venv-graphify/bin/activate
          python3 eval/compare_graphify.py corpus corpus/graphify-out/graph.json --queries 25
      - name: graphify's own benchmark, for comparison
        run: |
          set -euo pipefail
          source .venv-graphify/bin/activate
          cd corpus
          python3 -c "from graphify.benchmark import run_benchmark, print_benchmark; print_benchmark(run_benchmark())"
