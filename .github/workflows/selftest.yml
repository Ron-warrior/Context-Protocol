name: bench selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile the bench
        run: python3 -m py_compile eval/retrieval_bench.py
      - name: Run the fixture self-test
        run: python3 eval/retrieval_bench.py --selftest
      - name: Smoke-run every mode on this repo
        run: |
          python3 eval/retrieval_bench.py . --auto 10
          python3 eval/retrieval_bench.py . --auto 10 --sweep 1000,4000
          python3 eval/retrieval_bench.py . --auto 10 --stop
          python3 eval/retrieval_bench.py . --auto 10 --focus eval/retrieval_bench.py
