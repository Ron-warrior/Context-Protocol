name: ctx

on:
  push:
  pull_request:

jobs:
  real-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out an external repository as the corpus
        uses: actions/checkout@v4
        with:
          repository: tashfeenahmed/freellmapi
          fetch-depth: 1
          sparse-checkout: |
            server/src
            shared
            cli
          path: corpus
      - name: Size the corpus
        run: |
          echo "source files: $(find corpus -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.md' \) | wc -l)"
      - name: Sweep and ablate on a real repository with ctx
        run: |
          set -uo pipefail
          python3 ctx.py bench corpus --queries 25 --sweep 1000,4000,16000 > real.txt 2>&1
          sweep=$?
          cat real.txt
          python3 ctx.py bench corpus --queries 25 --ablate >> real.txt 2>&1
          ablate=$?
          tail -n 40 real.txt
          exit $((sweep || ablate))


  ctx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python3 -m py_compile ctx.py
      - name: Version
        run: |
          set -euo pipefail
          python3 ctx.py --version
          # The stamp drifted three times now (2.6.0 at 2.12.0, 2.10.0 at 2.13.0,
          # and pyproject.toml sat at 2.0.0 through seventeen releases because the
          # check below only looked at two files). Every file that carries the
          # number is compared against every other, exactly.
          code=$(grep -oE '__version__ = "[0-9.]+"' ctx.py | grep -oE '[0-9.]+')
          readme=$(grep -oE 'Version: [0-9]+\.[0-9]+\.[0-9]+' README.md | grep -oE '[0-9.]+')
          pkg=$(grep -oE '^version = "[0-9.]+"' pyproject.toml | grep -oE '[0-9.]+')
          echo "code=$code readme=$readme pyproject=$pkg"
          [ "$code" = "$readme" ] || {
            echo "version drift: ctx.py has $code, README.md has $readme"
            exit 1
          }
          [ "$code" = "$pkg" ] || {
            echo "version drift: ctx.py has $code, pyproject.toml has $pkg"
            exit 1
          }
      - name: Self-test
        run: python3 ctx.py selftest
      - name: The previous version, applied to this repository
        run: |
          set -euo pipefail
          # The loop, enforced instead of narrated: fetch the *published* 2.22.0
          # file and run its own `next` on this checkout. Its output is what 2.24.0
          # was built from, and every future run keeps that receipt in the log.
          # curl -f makes an unreachable file fail the job rather than quietly
          # skipping the check that the loop actually closes.
          curl -fsSL -o /tmp/ctx-2.22.0.py \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/5040f25/ctx.py"
          python3 /tmp/ctx-2.22.0.py --version
          echo "--- 2.22.0, applied to this repository ---"
          python3 /tmp/ctx-2.22.0.py next . --queries 100 --rare 1 --code-only
          echo "--- 2.24.0, on the same repository ---"
          python3 ctx.py next . --queries 100 --rare 1 --code-only
      # Measurement comes before installation on purpose. Twice now the install
      # step failed and took the benchmark down with it, which meant the run
      # reported a defect but produced no numbers to act on.
      - name: Exercise every command
        run: |
          set -euo pipefail
          # Each documented command runs at least once, so "finished" means every
          # one of them was actually executed somewhere.
          python3 ctx.py --version
          python3 ctx.py map . | head -n 3
          python3 ctx.py plan
          python3 ctx.py query . "how does the ladder rank files" --explain
          python3 ctx.py query . "how does the ladder rank files" --rank-only
          python3 ctx.py query . "how does the ladder rank files" --json > /dev/null
          python3 ctx.py ask "how does the ladder rank files" --budget 2000
          python3 ctx.py path refresh token
          python3 ctx.py selftest
      - name: The repository that has not started
        run: |
          set -uo pipefail
          # The runner's shell starts with -e, and the two cases under test exit 1
          # on purpose, so -e has to go or the step dies at the first one and never
          # reaches its own checks. Every status is inspected below instead.
          set +e
          # Both cases exit 1 by design -- no context was produced -- so the point
          # is not the status but the message: a typo and a greenfield project must
          # not answer the same way, or the tool says nothing to anyone starting one.
          empty="$(mktemp -d)"
          out=$(python3 ctx.py map "$empty" 2>&1)
          status=$?
          echo "$out"
          if [ "$status" -ne 1 ]; then
            echo "an empty corpus must exit 1, got $status"; exit 1
          fi
          if ! echo "$out" | grep -q "rung 0 applies now"; then
            echo "an empty corpus must point at rung 0"; exit 1
          fi
          out=$(python3 ctx.py map "$empty/nope" 2>&1)
          status=$?
          echo "$out"
          if [ "$status" -ne 1 ]; then
            echo "a missing path must exit 1, got $status"; exit 1
          fi
          if ! echo "$out" | grep -q "does not exist"; then
            echo "a missing path must be named as one"; exit 1
          fi
          if ! python3 ctx.py plan | grep -q "No files yet"; then
            echo "ctx plan must name the zero-file case"; exit 1
          fi
      - name: The clean-room JS rewrite, before any source exists
        run: |
          set -euo pipefail
          # A text-only coder cannot see a file the corpus refuses to load. The
          # entry point of a JS rewrite is HTML, then CSS and XML in an Android
          # port; none of them were in TEXT_EXT before 3.1.0.
          room="$(mktemp -d)"
          printf '<title>app entry point</title>\n<script src="game.js"></script>\n' > "$room/index.html"
          printf 'body { margin: 0 }\n' > "$room/app.css"
          printf '<manifest package="com.example.game"/>\n' > "$room/AndroidManifest.xml"
          printf 'plugins { id "java" }\n' > "$room/build.gradle"
          printf '\211PNG not source\n' > "$room/image.png"
          python3 ctx.py map "$room" | tee decl-map.txt
          for name in index.html app.css AndroidManifest.xml build.gradle; do
            grep -q "$name" decl-map.txt || { echo "missing from the map: $name"; exit 1; }
          done
          if grep -q "image.png" decl-map.txt; then
            echo "a binary asset must not be ranked as source"; exit 1
          fi
          python3 ctx.py query "$room" "app entry point start" | tee decl-query.txt
          grep -q "index.html" decl-query.txt || {
            echo "the HTML entry point must reach the context"; exit 1
          }
      - name: Bench this repository (intelligence vs lean)
        run: |
          set -uo pipefail
          # A green run reports nothing back to whoever is deciding; a red one
          # prints every number. So the floor is the reporting channel, not just a
          # guard: 0.75 is the line below which a version has regressed. The bench
          # runs at the default budget, which 3.0.0 set to the measured knee.
          python3 ctx.py bench . --queries 100 --floor 0.75 > bench-self.txt 2>&1
          status=$?
          cat bench-self.txt
          {
            echo '### bench: this repository, floor 0.75'
            echo '```'
            cat bench-self.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Check out a second corpus (Python, not TypeScript)
        uses: actions/checkout@v4
        with:
          repository: Graphify-Labs/graphify
          ref: v8
          fetch-depth: 1
          sparse-checkout: |
            graphify/graphify
          path: corpus2
      - name: Bench the second corpus
        run: |
          set -uo pipefail
          python3 ctx.py bench corpus2 --queries 100 > bench-corpus2.txt 2>&1
          status=$?
          cat bench-corpus2.txt
          {
            echo '### bench: graphify corpus'
            echo '```'
            cat bench-corpus2.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Install as a console script
        run: |
          set -euxo pipefail
          python3 -m venv .venv-ctx
          source .venv-ctx/bin/activate
          pip install --quiet .
          which ctx
          ctx selftest
          ctx map . | head -n 5
      - name: Install from the public URL the README tells people to use
        run: |
          set -euxo pipefail
          # README tells anyone to run `pipx install git+https://github.com/
          # Ron-warrior/Context-Protocol`. Until the repository went public that
          # command could not work at all, so the claim had never executed once.
          # A git install builds the same pyproject a stranger gets, so this is
          # the stranger's path, not the local one.
          python3 -m venv .venv-git
          source .venv-git/bin/activate
          pip install --quiet "git+https://github.com/${GITHUB_REPOSITORY}.git@${GITHUB_SHA}"
          # Leave the checkout: otherwise `ctx` could resolve to ./ctx.py on the
          # import path and prove nothing about the installed package.
          cd /tmp
          ctx --version
          ctx selftest
      - name: Check out a real corpus
        uses: actions/checkout@v4
        with:
          repository: tashfeenahmed/freellmapi
          fetch-depth: 1
          sparse-checkout: |
            server/src
            shared
            cli
          path: corpus
      - name: Query and bench the real corpus with ctx
        run: |
          set -uo pipefail
          python3 ctx.py query corpus "how are provider keys stored" --budget 2000
          python3 ctx.py bench corpus --queries 100 > bench-corpus.txt 2>&1
          normal=$?
          cat bench-corpus.txt
          echo "--- hard mode: needles that exist in exactly one file ---"
          python3 ctx.py bench corpus --queries 100 --rare 1 > bench-corpus-hard.txt 2>&1
          hard=$?
          cat bench-corpus-hard.txt
          echo "--- where the misses come from ---"
          python3 ctx.py bench corpus --queries 100 --rare 1 --diagnose >> bench-corpus-hard.txt 2>&1
          diag=$?
          echo "--- what the next version should fix ---"
          python3 ctx.py next corpus --queries 100 --rare 1 >> bench-corpus-hard.txt 2>&1
          next=$?
          echo "--- hard, code-only needles (prose excluded) ---"
          python3 ctx.py bench corpus --queries 100 --rare 1 --code-only >> bench-corpus-hard.txt 2>&1
          codeonly=$?
          python3 ctx.py next corpus --queries 100 --rare 1 --code-only >> bench-corpus-hard.txt 2>&1
          tail -n 60 bench-corpus-hard.txt
          {
            echo '### bench: freellmapi, normal'
            echo '```'
            cat bench-corpus.txt
            echo '```'
            echo '### bench: freellmapi, hard, and where the misses come from'
            echo '```'
            cat bench-corpus-hard.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $((normal || hard || diag || next || codeonly))


  primitives:
    # A sweep is one full pass per budget and an ablation is one per phase, so at
    # 100 queries this is a dozen passes: it belongs in its own bounded job rather
    # than stretching the measurements above past their timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out the corpus
        uses: actions/checkout@v4
        with:
          repository: tashfeenahmed/freellmapi
          fetch-depth: 1
          sparse-checkout: |
            server/src
            shared
            cli
          path: corpus
      - name: Sweep, ablate, and name the default-set misses
        run: |
          set -uo pipefail
          # The sweep names the smallest budget that holds recall; the ablation
          # names phases that charge tokens for nothing; next on the default set
          # names the misses the hard sets do not have. All three are printed, so
          # the next version starts from numbers rather than from a guess.
          python3 ctx.py bench corpus --queries 50 --sweep 1000,2000,4000 > primitives.txt 2>&1
          sweep=$?
          cat primitives.txt
          python3 ctx.py bench corpus --queries 50 --ablate >> primitives.txt 2>&1
          ablate=$?
          # The knee is set from the strictest set: code-only draws from a different
          # pool, so a budget that holds the identifier set can still lose a task
          # there. Intelligence is the first priority, so the budget is the largest
          # knee across the sets, not the smallest.
          echo "--- the knee on the code-only set ---"
          python3 ctx.py bench corpus --queries 50 --rare 1 --code-only --sweep 800,1000,1500,2000 >> primitives.txt 2>&1
          csweep=$?
          python3 ctx.py next corpus --queries 100 >> primitives.txt 2>&1
          misses=$?
          # The same ablation on hand-written questions. Identifier lookups are
          # answered by the body of the top file alone, so a phase that earns
          # nothing there may still earn everything on a real question. Dropping
          # a phase on the identifier set alone would be the prose-needle mistake
          # again: a benchmark that flatters the tool it is measuring.
          echo "--- the same sweep and ablation on questions, not lookups ---"
          python3 ctx.py bench eval/fixtures/ladder --queries eval/tasks.json --sweep 500,1000,2000,4000 >> primitives.txt 2>&1
          qsweep=$?
          python3 ctx.py bench eval/fixtures/ladder --queries eval/tasks.json --ablate >> primitives.txt 2>&1
          qablate=$?
          tail -n 80 primitives.txt
          {
            echo '### primitives: sweep, ablation, default-set misses'
            echo '```'
            cat primitives.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $((sweep || ablate || csweep || misses || qsweep || qablate))
