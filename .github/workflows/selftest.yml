name: bench selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile the bench
        run: python3 -m py_compile eval/retrieval_bench.py
      - name: Run the fixture self-test
        run: python3 eval/retrieval_bench.py --selftest
      - name: Smoke-run every mode on this repo
        run: |
          python3 eval/retrieval_bench.py . --auto 10
          python3 eval/retrieval_bench.py . --auto 10 --sweep 1000,4000
          python3 eval/retrieval_bench.py . --auto 10 --stop
          python3 eval/retrieval_bench.py . --auto 10 --ablate
          python3 eval/retrieval_bench.py . --auto 10 --outline-sweep 0.2,0.4
          python3 eval/retrieval_bench.py . --auto 10 --focus eval/retrieval_bench.py


  real-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out an external repository as the corpus
        uses: actions/checkout@v4
        with:
          repository: tashfeenahmed/freellmapi
          fetch-depth: 1
          sparse-checkout: |
            server/src
            shared
            cli
          path: corpus
      - name: Size the corpus
        run: |
          echo "source files: $(find corpus -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.md' \) | wc -l)"
      - name: Sweep on a real repository
        run: python3 eval/retrieval_bench.py corpus --auto 25 --sweep 1000,4000,16000
      - name: Stop rules on a real repository
        run: python3 eval/retrieval_bench.py corpus --auto 25 --stop
      - name: Rung-2 ablation on a real repository
        run: python3 eval/retrieval_bench.py corpus --auto 25 --ablate
      - name: Outline-share sweep on a real repository
        run: python3 eval/retrieval_bench.py corpus --auto 25 --outline-sweep 0.2,0.4,0.6


  ctx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python3 -m py_compile ctx.py
      - name: Version
        run: python3 ctx.py --version
      - name: Self-test
        run: python3 ctx.py selftest
      # Measurement comes before installation on purpose. Twice now the install
      # step failed and took the benchmark down with it, which meant the run
      # reported a defect but produced no numbers to act on.
      - name: Query this repository
        run: |
          set -euo pipefail
          python3 ctx.py query . "how does the ladder rank files" --explain
          python3 ctx.py query . "how does the ladder rank files" --rank-only
          python3 ctx.py ask "how does the ladder rank files" --budget 2000
      - name: Bench this repository (intelligence vs lean)
        run: |
          set -euo pipefail
          python3 ctx.py bench . --queries 100
      - name: Check out a second corpus (Python, not TypeScript)
        uses: actions/checkout@v4
        with:
          repository: Graphify-Labs/graphify
          ref: v8
          fetch-depth: 1
          sparse-checkout: |
            graphify/graphify
          path: corpus2
      - name: Bench the second corpus
        run: |
          set -euo pipefail
          python3 ctx.py bench corpus2 --queries 100
      - name: Install as a console script
        run: |
          set -euxo pipefail
          python3 -m venv .venv-ctx
          source .venv-ctx/bin/activate
          pip install --quiet .
          which ctx
          ctx selftest
          ctx map . | head -n 5
      - name: Check out a real corpus
        uses: actions/checkout@v4
        with:
          repository: tashfeenahmed/freellmapi
          fetch-depth: 1
          sparse-checkout: |
            server/src
            shared
            cli
          path: corpus
      - name: Query and bench the real corpus with ctx
        run: |
          set -euo pipefail
          python3 ctx.py query corpus "how are provider keys stored" --budget 2000
          python3 ctx.py bench corpus --queries 100
