[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-protocol"
version = "2.28.0"
description = "Rank, map and scope a codebase for a question under a token budget. No dependencies, stdlib only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["context", "retrieval", "codebase", "agent", "llm", "token-budget"]
dependencies = []

[project.urls]
Repository = "https://github.com/Ron-warrior/Context-Protocol"

[project.scripts]
ctx = "ctx:main"

[tool.setuptools]
py-modules = ["ctx"]
